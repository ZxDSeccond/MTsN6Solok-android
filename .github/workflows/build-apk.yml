name: Build APK from ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK manually
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" || true
          fi

          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euxo pipefail
          ls -la

          ZIP_FILE="CBT-MTsN6-Solok-Android-Project.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== cari gradlew ==="
          find extracted -name gradlew -print

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT_DIR=$(find extracted -name gradlew -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew tidak ditemukan di ZIP yang diextract"
            exit 1
          fi

          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
