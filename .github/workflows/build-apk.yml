name: Build APK from ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" || true
          fi

          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

      - name: Install Gradle 8.5
        shell: bash
        run: |
          set -euxo pipefail

          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle-8.5-bin.zip
          sudo rm -rf /opt/gradle-8.5
          sudo unzip -q /tmp/gradle-8.5-bin.zip -d /opt
          sudo ln -sfn /opt/gradle-8.5 /usr/local/gradle
          echo "/usr/local/gradle/bin" >> "$GITHUB_PATH"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euxo pipefail

          ZIP_FILE="CBT-MTsN6-Solok-Android-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Struktur hasil extract ==="
          find extracted -maxdepth 8 -print

      - name: Find actual Android project root and build
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT_DIR=$(find extracted -type d -print0 | while IFS= read -r -d '' d; do
            if [ -f "$d/settings.gradle" ] && [ -f "$d/app/build.gradle" ]; then
              echo "$d"
              break
            fi
          done)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Tidak ditemukan root project Android yang valid di hasil extract"
            echo "=== Tree penuh ==="
            find extracted -maxdepth 8 -print
            exit 1
          fi

          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          gradle -v

          if [ ! -f gradlew ]; then
            echo "Generate wrapper..."
            gradle wrapper --gradle-version 8.5
          fi

          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
