name: Build APK from ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK manually
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" || true
          fi

          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Install Gradle
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_FILE="CBT-MTsN6-Solok-Android-Project.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== struktur hasil extract ==="
          find extracted -maxdepth 4 -print

      - name: Generate gradlew if missing, then build APK
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT_DIR=$(find extracted -maxdepth 3 -name build.gradle -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "build.gradle tidak ditemukan di hasil extract"
            exit 1
          fi

          echo "Project dir: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "gradlew tidak ada, generate wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
